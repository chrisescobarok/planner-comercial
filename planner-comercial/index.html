<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner Comercial - Metro Ecuador</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .auth-controls { display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div style="display:flex; align-items:center; gap:15px;">
                    <div class="logo-circle">ME</div>
                    <div>
                        <h1>Planner Comercial - Dashboard</h1>
                        <p>Visualización de contenido editorial y comercial</p>
                    </div>
                </div>
                <div class="auth-controls">
                    <span id="authStatus">👁️ Modo público</span>
                    <button id="roleLoginBtn" class="btn-secondary">Ingresar</button>
                    <button id="logoutBtn" class="btn-secondary" style="display:none;">Cerrar sesión</button>
                    <button id="btnNuevaAccion" style="display:none; background:#f97316; color:white; font-weight:bold; border:none; padding:8px 15px; border-radius:10px; cursor:pointer; height:38px; margin:0;">+ Nueva acción</button>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card"><h3>Total acciones</h3><p id="statTotal">0</p></div>
                <div class="stat-card"><h3>Libres</h3><p id="statLibre">0</p></div>
                <div class="stat-card"><h3>Reservadas</h3><p id="statReservado">0</p></div>
                <div class="stat-card"><h3>Vendidas</h3><p id="statVendido">0</p></div>
            </div>

            <div class="view-switch">
                <button data-view="diaria">Vista diaria</button>
                <button data-view="semanal">Vista semanal</button>
                <button data-view="mensual">Vista mensual</button>
                <button data-view="lista" class="active">Vista lista</button>
            </div>
        </header>

        <main id="content">
            </main>
    </div>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2>Acceso Personal Metro</h2>
            <input type="text" id="userInput" placeholder="Usuario">
            <input type="password" id="passInput" placeholder="Contraseña">
            <button onclick="attemptLogin()" class="btn-primary" style="width:100%; margin-top:10px;">Entrar</button>
            <button onclick="closeLogin()" class="btn-mini" style="margin-top:10px;">Cancelar</button>
        </div>
    </div>

    <div id="actionModal" class="modal">
        <div class="modal-content">
            <h2>Nueva Acción Planificada</h2>
            <input type="text" id="newTitle" placeholder="Título de la Acción">
            <input type="date" id="newDate">
            <input type="time" id="newTime">
            <select id="newResp">
                <option value="Christian">Christian</option>
                <option value="Andrea">Andrea</option>
                <option value="Gaby Vaca">Gaby Vaca</option>
                <option value="Carlos Bolaños">Carlos Bolaños</option>
            </select>
            <select id="newStatus">
                <option value="libre">Libre</option>
                <option value="reservado">Reservado</option>
                <option value="vendido">Vendido</option>
            </select>
            <button onclick="saveNewAction()" class="btn-primary" style="width:100%; margin-top:15px;">Guardar</button>
            <button onclick="closeActionModal()" class="btn-mini" style="margin-top:10px;">Cerrar</button>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
