<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Deportivo - Metro Ecuador</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <nav class="sidebar">
            <div class="logo">
                <img src="https://www.metroecuador.com.ec/resizer/v2/7Z6N7J4Z5ZGV3K4Z5ZGV3K4Z5Z.png?auth=1a7a7a7a7a7a7a7a7a7a7a7a7a7a7a7a7a7a7a7a7a7a7a7a7a7a7a7a7a7a7a7a&width=300" alt="Metro Logo">
            </div>
            <ul class="nav-links">
                <li class="active"><a href="#"><i class="fas fa-home"></i> Inicio</a></li>
                <li><a href="#"><i class="fas fa-trophy"></i> Liga Pro</a></li>
                <li><a href="#"><i class="fas fa-futbol"></i> La Tri</a></li>
                <li><a href="#"><i class="fas fa-chart-line"></i> Estadísticas</a></li>
            </ul>
        </nav>

        <main class="main-content">
            <header>
                <h1>Dashboard de Noticias Deportivas</h1>
                <div class="user-info">
                    <span id="current-date"></span>
                </div>
            </header>

            <div class="grid-container">
                <div class="card match-card">
                    <h3>Próximo Partido - Ecuador</h3>
                    <div class="match-details">
                        <div class="team">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e8/Flag_of_Ecuador.svg" alt="Ecuador">
                            <span>Ecuador</span>
                        </div>
                        <div class="vs">VS</div>
                        <div class="team">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Flag_of_Brazil.svg" alt="Brasil">
                            <span>Brasil</span>
                        </div>
                    </div>
                    <p class="match-time">15 de Junio - 18:00 (EST)</p>
                </div>

                <div class="card stats-card">
                    <h3>Tabla Liga Pro</h3>
                    <table id="league-table">
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th>Equipo</th>
                                <th>Pts</th>
                            </tr>
                        </thead>
                        <tbody>
                            </tbody>
                    </table>
                </div>

                <div class="card news-card">
                    <h3>Titulares de Hoy</h3>
                    <div id="news-feed">
                        </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
