<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner Comercial - Metro Ecuador</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Ajuste de emergencia para alinear botones arriba */
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .auth-controls { display: flex; align-items: center; gap: 10px; }
        #btnNuevaAccion { height: 38px; margin: 0; vertical-align: middle; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div style="display:flex; align-items:center; gap:15px;">
                    <div class="logo-circle">ME</div>
                    <div>
                        <h1>Planner Comercial - Dashboard</h1>
                        <p>Visualización de contenido editorial y comercial</p>
                    </div>
                </div>
                <div class="auth-controls">
                    <span id="authStatus">👁️ Modo público</span>
                    <button id="roleLoginBtn" class="btn-secondary" onclick="openLogin()">Ingresar</button>
                    <button id="logoutBtn" class="btn-secondary" style="display:none;" onclick="logout()">Cerrar sesión</button>
                    <button id="btnNuevaAccion" style="display:none; background:#f97316; color:white; font-weight:bold; border:none; padding:8px 15px; border-radius:10px; cursor:pointer;" onclick="openActionModal()">+ Nueva acción</button>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card"><h3>Total acciones</h3><p id="statTotal">0</p></div>
                <div class="stat-card"><h3>Libres</h3><p id="statLibre">0</p></div>
                <div class="stat-card"><h3>Reservadas</h3><p id="statReservado">0</p></div>
                <div class="stat-card"><h3>Vendidas</h3><p id="statVendido">0</p></div>
            </div>

            <div class="view-switch">
                <button data-view="diaria">Vista diaria</button>
                <button data-view="semanal">Vista semanal</button>
                <button data-view="mensual">Vista mensual</button>
                <button data-view="lista" class="active">Vista lista</button>
            </div>
        </header>

        <main id="content">
            </main>
    </div>

    <div id="loginModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h2>Acceso Personal Metro</h2>
            <div style="margin-top:15px;">
                <input type="text" id="userInput" placeholder="Usuario" style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;">
                <input type="password" id="passInput" placeholder="Contraseña" style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;">
                <button onclick="attemptLogin()" class="btn-primary" style="width:100%;">Entrar</button>
                <button onclick="closeLogin()" style="width:100%; margin-top:10px; background:none; border:none; color:gray; cursor:pointer;">Cancelar</button>
            </div>
        </div>
    </div>
