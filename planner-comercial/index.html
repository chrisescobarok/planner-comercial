<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner Comercial - Metro Ecuador</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Ajuste de alineación para los botones superiores */
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .auth-controls { display: flex; align-items: center; gap: 10px; }
        #btnNuevaAccion { height: 38px; margin: 0; vertical-align: middle; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div style="display:flex; align-items:center; gap:15px;">
                    <div class="logo-circle">ME</div>
                    <div>
                        <h1>Planner Comercial - Dashboard</h1>
                        <p>Visualización de contenido editorial y comercial</p>
                    </div>
                </div>
                <div class="auth-controls">
                    <span id="authStatus" style="font-size: 14px; font-weight: 500;">👁️ Modo público</span>
                    <button id="roleLoginBtn" class="btn-secondary" onclick="openLogin()">Ingresar</button>
                    <button id="logoutBtn" class="btn-secondary" style="display:none;" onclick="logout()">Cerrar sesión</button>
                    <button id="btnNuevaAccion" style="display:none; background:#f97316; color:white; font-weight:bold; border:none; padding:8px 15px; border-radius:10px; cursor:pointer;" onclick="openActionModal()">+ Nueva acción</button>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card"><h3>Total acciones</h3><p id="statTotal">0</p></div>
                <div class="stat-card"><h3>Libres</h3><p id="statLibre">0</p></div>
                <div class="stat-card"><h3>Reservadas</h3><p id="statReservado">0</p></div>
                <div class="stat-card"><h3>Vendidas</h3><p id="statVendido">0</p></div>
            </div>

            <div class="view-switch">
                <button data-view="diaria">Vista diaria</button>
                <button data-view="semanal">Vista semanal</button>
                <button data-view="mensual">Vista mensual</button>
                <button data-view="lista" class="active">Vista lista</button>
            </div>
        </header>

        <main id="content">
            </main>
    </div>

    <div id="loginModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; align-items:center; justify-content:center;">
        <div class="modal-content" style="background:white; padding:30px; border-radius:15px; width:100%; max-width:400px;">
            <h2 style="margin-top:0;">Acceso Personal Metro</h2>
            <div style="margin-top:20px;">
                <label style="display:block; margin-bottom:5px; font-weight:bold;">Usuario</label>
                <input type="text" id="userInput" style="width:100%; padding:10px; margin-bottom:15px; border-radius:8px; border:1px solid #ddd; box-sizing:border-box;">
                <label style="display:block; margin-bottom:5px; font-weight:bold;">Contraseña</label>
                <input type="password" id="passInput" style="width:100%; padding:10px; margin-bottom:15px; border-radius:8px; border:1px solid #ddd; box-sizing:border-box;">
                <button onclick="attemptLogin()" style="width:100%; padding:12px; background:#111827; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Entrar</button>
                <button onclick="closeLogin()" style="width:100%; margin-top:10px; background:none; border:none; color:gray; cursor:pointer;">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="actionModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; align-items:center; justify-content:center;">
        <div class="modal-content" style="background:white; padding:30px; border-radius:15px; width:100%; max-width:500px;">
            <h2 style="margin-top:0;">Nueva Acción Planificada</h2>
            <div style="margin-top:20px;">
                <input type="text" id="newTitle
